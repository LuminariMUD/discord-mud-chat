name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.18.0
          - 26.8.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

  generic-sample:
    name: Generic C89 sample
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cJSON development library
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Test generic sample with sanitizers
        run: SANITIZE=1 python3 scripts/test-generic-sample.py

  container:
    name: Build and exercise production container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image and check host-loopback deployment
        run: python3 scripts/test-container.py
