name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.label }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 24 (minimum)
            node-version: 24.22.3
          - label: 26 (project default)
            node-version-file: .nvmrc

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm

      - name: Use project npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install MariaDB for isolated news delivery tests
        run: sudo apt-get update && sudo apt-get install -y mariadb-server

      - name: Test with coverage thresholds
        run: bash scripts/test-news-mariadb.sh npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check PM2 deployment
        if: matrix.node-version-file == '.nvmrc'
        run: npm exec --yes --package=pm2@7.1.2 -- node scripts/check-pm2.js

  generic-sample:
    name: Generic C89 sample
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cJSON development library
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Test generic sample with sanitizers
        run: SANITIZE=1 python3 scripts/test-generic-sample.py

  container:
    name: Build and exercise production container
    runs-on: ubuntu-26.04
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image and check host-loopback deployment
        run: python3 scripts/test-container.py
